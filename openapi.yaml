openapi: 3.0.3
info:
  title: Threshwork
  version: 0.1.0
  description: >-
    Automation portfolio control plane for content operations. Scores every review
    queue on capacity, difficulty, and impact; sets the confidence threshold at which
    a machine decision stands without a human; routes work between classifier vendors
    and human agents under statutory clocks and rights gates; and meters realised
    benefit per queue against the business case that funded it.
  x-product-slug: ai-content-threshwork
  x-source: ai-in-content/Accenture-AI-In-Content-Services/
servers:
  - url: https://api.example.com
tags:
  - name: Queues
    description: Queue registry, policy definitions, and taxonomy pinning
  - name: Scorecards
    description: Weighted automation scorecards across capacity, difficulty, and impact
  - name: Routing
    description: Work item intake, rights gating, and machine or human dispatch
  - name: Review
    description: Human review workbench decisions and calibration sampling
  - name: Appeals
    description: Reversal of machine decisions by a second human
  - name: Vendors
    description: Classifier connectors, shadow evaluation, and traffic cutover
  - name: Clocks
    description: Statutory removal windows and contractual SLA tracking
  - name: Benefits
    description: Realised versus promised benefit per funded automation
  - name: Governance
    description: Automation approval, egress records, and agent exposure ledgers
  - name: Roadmap
    description: Scheduled and trigger-driven re-scoring of the automation portfolio
paths:
  /v1/queues:
    get:
      operationId: listQueues
      tags: [Queues]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: impactTier
          in: query
          schema:
            $ref: "#/components/schemas/ImpactTier"
        - name: automationStatus
          in: query
          schema:
            type: string
            enum: [not_assessed, blocked, approved_pilot, approved_scaled, suspended, reverted]
      responses:
        "200":
          description: Queues page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeQueue"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: registerQueue
      tags: [Queues]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueCreate"
      responses:
        "201":
          description: Queue registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeQueue"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/queues/{queueId}:
    parameters:
      - $ref: "#/components/parameters/QueueId"
    get:
      operationId: getQueue
      tags: [Queues]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeQueue"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/queues/{queueId}/policy-definition:
    parameters:
      - $ref: "#/components/parameters/QueueId"
    put:
      operationId: pinPolicyDefinition
      tags: [Queues]
      description: >-
        Pin the policy and taxonomy version a queue is scored and automated against.
        A queue whose definition is marked unstable cannot be approved for automation.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyDefinition"
      responses:
        "200":
          description: Policy definition pinned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopePolicyDefinition"
        "409":
          description: Definition is unstable and the queue has live automation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/queues/{queueId}/scorecard:
    parameters:
      - $ref: "#/components/parameters/QueueId"
    get:
      operationId: getQueueScorecard
      tags: [Scorecards]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current weighted scorecard for the queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeQueueScorecard"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: scoreQueue
      tags: [Scorecards]
      description: >-
        Run a scorecard against agreed weightings. Weightings must be supplied and
        are recorded with the score so the ranking is reproducible later.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueScorecardCreate"
      responses:
        "201":
          description: Scorecard recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeQueueScorecard"
  /v1/queues/{queueId}/threshold-policy:
    parameters:
      - $ref: "#/components/parameters/QueueId"
    get:
      operationId: getThresholdPolicy
      tags: [Scorecards]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Active threshold policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeThresholdPolicy"
    put:
      operationId: setThresholdPolicy
      tags: [Scorecards]
      description: >-
        Loosening a threshold below the floor mandated by the queue impact tier
        requires an active governance approval and is otherwise refused.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThresholdPolicy"
      responses:
        "200":
          description: Threshold policy updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeThresholdPolicy"
        "403":
          description: Threshold below tier floor without governance approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/work-items:
    get:
      operationId: listWorkItems
      tags: [Routing]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: queueId
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
            enum: [received, rights_blocked, routed, machine_final, awaiting_human, human_final, appealed, closed]
      responses:
        "200":
          description: Work items page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeWorkItem"
    post:
      operationId: submitWorkItem
      tags: [Routing]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkItemCreate"
      responses:
        "202":
          description: Work item accepted and routed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeWorkItem"
        "409":
          description: Rights gate blocked the item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/work-items/{workItemId}/routing:
    parameters:
      - $ref: "#/components/parameters/WorkItemId"
    get:
      operationId: getRoutingDecision
      tags: [Routing]
      description: Which lane the item took, at what confidence, under which vendor and terms.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Routing decision with evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeRoutingDecision"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/work-items/{workItemId}/rights:
    parameters:
      - $ref: "#/components/parameters/WorkItemId"
    get:
      operationId: getRightsRecord
      tags: [Routing]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Licence and usage-right status for the underlying asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeRightsRecord"
  /v1/work-items/{workItemId}/review:
    parameters:
      - $ref: "#/components/parameters/WorkItemId"
    post:
      operationId: recordHumanReview
      tags: [Review]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HumanReviewCreate"
      responses:
        "201":
          description: Human decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeHumanReview"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/review/calibration-samples:
    get:
      operationId: listCalibrationSamples
      tags: [Review]
      description: >-
        Machine-final decisions drawn for sampled re-review, used to detect drift
        before it reaches a regulator or a published harm.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: queueId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Calibration samples page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeHumanReview"
  /v1/appeals:
    get:
      operationId: listAppeals
      tags: [Appeals]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: outcome
          in: query
          schema:
            type: string
            enum: [pending, upheld, rejected, expired]
      responses:
        "200":
          description: Appeals page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeAppeal"
    post:
      operationId: openAppeal
      tags: [Appeals]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppealCreate"
      responses:
        "201":
          description: Appeal opened and assigned to a reviewer other than the original
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeAppeal"
  /v1/appeals/{appealId}/resolution:
    parameters:
      - $ref: "#/components/parameters/AppealId"
    post:
      operationId: resolveAppeal
      tags: [Appeals]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, rationale]
              properties:
                outcome:
                  type: string
                  enum: [upheld, rejected]
                rationale:
                  type: string
                feedsCalibrationSet:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Appeal resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeAppeal"
        "403":
          description: Reviewer made the original decision and may not adjudicate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/vendors:
    get:
      operationId: listVendorConnectors
      tags: [Vendors]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: capability
          in: query
          schema:
            $ref: "#/components/schemas/VendorCapability"
      responses:
        "200":
          description: Vendor connectors page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeVendorConnector"
    post:
      operationId: registerVendorConnector
      tags: [Vendors]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorConnectorCreate"
      responses:
        "201":
          description: Vendor connector registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeVendorConnector"
  /v1/vendors/{vendorId}/evaluations:
    parameters:
      - $ref: "#/components/parameters/VendorId"
    get:
      operationId: listVendorEvaluations
      tags: [Vendors]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Evaluations page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeVendorEvaluation"
    post:
      operationId: startVendorEvaluation
      tags: [Vendors]
      description: >-
        Run a candidate vendor in shadow against the operation's own golden set and
        optionally against live queue traffic, without acting on the result.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorEvaluationCreate"
      responses:
        "202":
          description: Shadow evaluation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeVendorEvaluation"
  /v1/queues/{queueId}/vendor-cutover:
    parameters:
      - $ref: "#/components/parameters/QueueId"
    post:
      operationId: cutoverVendorTraffic
      tags: [Vendors]
      description: >-
        Move a queue to a different vendor or revert it to human-final decisioning,
        with a rollback window. Refused if the target vendor has no completed
        evaluation on this queue's golden set.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetVendorId, reason]
              properties:
                targetVendorId:
                  type: string
                  description: Use the literal value human_only to revert to human-final decisioning
                reason:
                  type: string
                  enum: [accuracy_drift, cost, coverage_gap, contract_end, incident, planned_migration]
                rollbackWindowMinutes:
                  type: integer
                  default: 120
      responses:
        "202":
          description: Cutover accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeQueue"
        "412":
          description: No completed shadow evaluation for the target vendor on this queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/golden-sets:
    get:
      operationId: listGoldenSets
      tags: [Vendors]
      description: Labelled samples drawn from the operation's own queues, used to judge vendors.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: queueId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Golden sets page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeGoldenSet"
  /v1/response-clocks:
    get:
      operationId: listResponseClocks
      tags: [Clocks]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            type: string
            enum: [running, at_risk, met, breached]
        - name: clockType
          in: query
          schema:
            type: string
            enum: [statutory_removal, localisation_sla, accessibility_remediation, client_contract]
      responses:
        "200":
          description: Response clocks page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeResponseClock"
  /v1/response-clocks/{clockId}/preempt:
    parameters:
      - $ref: "#/components/parameters/ClockId"
    post:
      operationId: preemptResponseClock
      tags: [Clocks]
      description: Promote the underlying item ahead of lower-priority work before breach.
      security:
        - BearerAuth: []
      responses:
        "202":
          description: Item promoted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeResponseClock"
  /v1/queues/{queueId}/benefit:
    parameters:
      - $ref: "#/components/parameters/QueueId"
    get:
      operationId: getBenefitRecord
      tags: [Benefits]
      description: Realised versus promised benefit against the funding business case.
      security:
        - BearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            example: 2026-08
      responses:
        "200":
          description: Benefit record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeBenefitRecord"
  /v1/governance/queues/{queueId}/automation-approval:
    parameters:
      - $ref: "#/components/parameters/QueueId"
    post:
      operationId: decideAutomationApproval
      tags: [Governance]
      description: >-
        Approve, refuse, suspend, or revert automation on a queue. Refusal reasons
        are recorded so an unstable policy definition cannot be automated by
        operational enthusiasm.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, rationale]
              properties:
                decision:
                  type: string
                  enum: [approve_pilot, approve_scaled, refuse, suspend, revert]
                rationale:
                  type: string
                refusalReason:
                  type: string
                  enum: [unstable_policy_definition, unstable_taxonomy, impact_tier_too_high, no_fallback_vendor, insufficient_evaluation, processing_terms_missing]
                reviewDueAt:
                  type: string
                  format: date-time
      responses:
        "200":
          description: Governance decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeQueue"
  /v1/governance/egress-records:
    get:
      operationId: listEgressRecords
      tags: [Governance]
      description: What content left the boundary, to which vendor, under which terms and territory.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: queueId
          in: query
          schema:
            type: string
        - name: vendorId
          in: query
          schema:
            type: string
        - name: period
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Egress records page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeEgressRecord"
  /v1/governance/exposure/{agentId}:
    parameters:
      - name: agentId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getExposureLedger
      tags: [Governance]
      description: >-
        Graphic-content handling hours for one agent against the policy cap. Returned
        only to the agent and to occupational-health roles, never in vendor reporting.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Exposure ledger entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeExposureLedgerEntry"
        "403":
          description: Caller is not permitted to read individual exposure data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/roadmap:
    get:
      operationId: listRoadmapEntries
      tags: [Roadmap]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Roadmap entries page, ranked by weighted score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeRoadmapEntry"
  /v1/roadmap/rescore:
    post:
      operationId: rescoreRoadmap
      tags: [Roadmap]
      description: >-
        Re-run the portfolio scorecard on a cadence or on a trigger such as
        regulatory change, sustained volume movement, or vendor capability change.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trigger]
              properties:
                trigger:
                  type: string
                  enum: [scheduled, regulatory_change, volume_shift, vendor_capability_change, incident, sponsor_request]
                note:
                  type: string
      responses:
        "202":
          description: Re-scoring accepted, change history updated for the sponsor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeRoadmapEntry"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    QueueId:
      name: queueId
      in: path
      required: true
      schema:
        type: string
    WorkItemId:
      name: workItemId
      in: path
      required: true
      schema:
        type: string
    AppealId:
      name: appealId
      in: path
      required: true
      schema:
        type: string
    VendorId:
      name: vendorId
      in: path
      required: true
      schema:
        type: string
    ClockId:
      name: clockId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    ResponseMeta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: number
          format: double
        currency:
          type: string
          example: USD
    ImpactTier:
      type: string
      description: >-
        Consequence of a wrong decision in this queue. Illegal content admitted to a
        platform and a mis-tagged product image do not share a threshold.
      enum: [critical_illegal, high_safety_policy, moderate_brand_or_accessibility, low_enrichment]
    TaskType:
      type: string
      enum:
        - policy_moderation
        - offensive_media_review
        - metadata_enrichment
        - catalogue_tagging
        - localisation_qa
        - transcreation_review
        - accessibility_captioning
        - accessibility_alt_text
        - rights_clearance
        - editorial_approval
    VendorCapability:
      type: string
      description: Capability rows from the source vendor landscape
      enum: [ingest_metadata, ingest_text, moderation_text, moderation_image, moderation_video, tagging_image, tagging_video, custom_training_text, custom_training_image]
    Queue:
      type: object
      required: [id, name, taskType, impactTier, automationStatus]
      properties:
        id:
          type: string
        name:
          type: string
        taskType:
          $ref: "#/components/schemas/TaskType"
        impactTier:
          $ref: "#/components/schemas/ImpactTier"
        automationStatus:
          type: string
          enum: [not_assessed, blocked, approved_pilot, approved_scaled, suspended, reverted]
        deploymentMode:
          type: string
          description: Deployment choice from the source WHY-WHERE-HOW framework
          enum: [human_only, human_in_the_loop, machine_final_with_sampling, machine_final]
        activeVendorId:
          type: string
        fallbackVendorId:
          type: string
        policyDefinitionId:
          type: string
        dailyVolume:
          type: integer
        averageHandlingTimeSeconds:
          type: integer
        qualityThreshold:
          type: number
          format: float
        territoryRestrictions:
          type: array
          items:
            type: string
    QueueCreate:
      type: object
      required: [name, taskType, impactTier]
      properties:
        name:
          type: string
        taskType:
          $ref: "#/components/schemas/TaskType"
        impactTier:
          $ref: "#/components/schemas/ImpactTier"
        policyDefinitionId:
          type: string
        dailyVolume:
          type: integer
        averageHandlingTimeSeconds:
          type: integer
        qualityThreshold:
          type: number
          format: float
        territoryRestrictions:
          type: array
          items:
