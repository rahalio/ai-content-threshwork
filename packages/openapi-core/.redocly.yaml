apis:
  identity:
    root: src/identity.yaml
  queues:
    root: src/queues.yaml
  routing:
    root: src/routing.yaml
  vendors:
    root: src/vendors.yaml
  portfolio:
    root: src/portfolio.yaml

extends:
  - recommended

rules:
  no-unused-components: off
  operation-4xx-response: warn
  info-license: off
  info-license-url: off
  tag-description: off
  operation-operationId: error
  no-invalid-media-type-examples: off

theme:
  openapi:
    generateCodeSamples:
      languages: []
